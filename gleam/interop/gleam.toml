name = "omni_interop"
version = "0.1.0"
description = "Temporary JS-friendly facades so remaining TypeScript can call Gleam. Removed when TS is gone."
target = "javascript"

[javascript]
typescript_declarations = true

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
omni_kernel = { path = "../kernel" }
omni_protocol = { path = "../protocol" }
omni_nostr = { path = "../nostr" }
omni_platform = { path = "../platform" }
omni_shell = { path = "../shell" }
omni_web = { path = "../web" }
omni_social = { path = "../social" }
omni_sandbox = { path = "../sandbox" }
omni_plugin_kit = { path = "../plugin_kit" }
lustre = ">= 5.7.1 and < 6.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
