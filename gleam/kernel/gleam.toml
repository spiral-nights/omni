name = "omni_kernel"
version = "0.1.0"
description = "Headless Omni runtime: ACL, relay pool, event store, RPC dispatch. No UI knowledge."
target = "javascript"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_javascript = ">= 1.0.1 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
omni_platform = { path = "../platform" }
omni_nostr = { path = "../nostr" }
omni_protocol = { path = "../protocol" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
qcheck = ">= 1.0.5 and < 2.0.0"
