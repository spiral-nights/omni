<div class="omni-box omni-box-column" data-direction="column" data-gap="md" data-padding="md" id="settings-form">
  <div class="omni-tabs omni-tabs-nav" role="tablist">
    <button aria-selected="true" class="omni-tab-btn active" data-tab-id="general" role="tab" type="button">
      <span class="omni-tab-icon">
        <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="omni-icon" data-icon="settings" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewBox="0 0 24 24" width="16">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </span>
      <span class="omni-tab-label">
        General
      </span>
    </button>
    <button aria-selected="false" class="omni-tab-btn" data-tab-id="relays" role="tab" type="button">
      <span class="omni-tab-icon">
        <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="omni-icon" data-icon="relay" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewBox="0 0 24 24" width="16">
          <rect height="8" rx="2" ry="2" width="20" x="2" y="2"></rect>
          <rect height="8" rx="2" ry="2" width="20" x="2" y="14"></rect>
          <line x1="6" x2="6.01" y1="6" y2="6"></line>
          <line x1="6" x2="6.01" y1="18" y2="18"></line>
        </svg>
      </span>
      <span class="omni-tab-label">
        Relays
      </span>
      <span class="omni-tab-badge">
        3
      </span>
    </button>
  </div>
  <div class="omni-input-wrapper omni-input-clearable omni-input-with-prefix">
    <span class="omni-input-prefix-icon">
      <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="omni-icon" data-icon="user" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewBox="0 0 24 24" width="16">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    </span>
    <input class="omni-input" name="display_name" placeholder="Display Name" type="text" value="Alice">
  </div>
  <textarea class="omni-textarea" name="about" placeholder="Bio" rows="3">
    Local-first enthusiast
  </textarea>
  <select class="omni-select" name="theme_shell">
    <option selected value="editorial">
      Omni Editorial
    </option>
    <option value="panorama">
      Panorama Hub
    </option>
    <option selected value="editorial">
      Editorial Shell
    </option>
  </select>
  <label class="omni-toggle omni-toggle-checked">
    <input checked class="omni-toggle-checkbox" name="offline_cache" type="checkbox">
    <span class="omni-toggle-track">
      <span class="omni-toggle-thumb"></span>
    </span>
    <span class="omni-toggle-label">
      0ms Local Event Store Cache
    </span>
  </label>
  <button class="omni-button omni-button-primary omni-button-md" data-action="save-settings" data-icon="check" data-size="md" data-variant="primary" type="button">
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="omni-icon" data-icon="check" fill="none" height="16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" viewBox="0 0 24 24" width="16">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span class="omni-button-label">
      Save Settings
    </span>
  </button>
</div>
